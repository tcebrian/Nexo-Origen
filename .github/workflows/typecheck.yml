name: Typecheck

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - supabase-reputation-cleanup-v1

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        shell: bash
        run: |
          set +e
          npm run typecheck -- --pretty false 2>&1 | tee /tmp/tsc.log
          STATUS=${PIPESTATUS[0]}

          while IFS= read -r LINE; do
            if [[ "$LINE" =~ ^(.+)\(([0-9]+),([0-9]+)\):\ error\ (TS[0-9]+):\ (.*)$ ]]; then
              FILE="${BASH_REMATCH[1]}"
              ROW="${BASH_REMATCH[2]}"
              COL="${BASH_REMATCH[3]}"
              CODE="${BASH_REMATCH[4]}"
              MSG="${BASH_REMATCH[5]}"
              echo "::error file=$FILE,line=$ROW,col=$COL,title=$CODE::$MSG"
            fi
          done < /tmp/tsc.log

          exit $STATUS
